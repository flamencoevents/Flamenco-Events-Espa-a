name: Import standalone Spanish Agency website

on:
  push:
    paths:
      - ".github/workflows/import-spanish.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-spanish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout independent destination repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import site and binary image assets from the prepared PUBLIC branch
        shell: bash
        run: |
          set -euo pipefail
          git clone --branch spanish-agency-staging --single-branch --depth 1 \
            https://github.com/flamencoevents/Flamenco-Events-app.git /tmp/flamenco-spanish-source
          rsync -a --exclude='.git' --exclude='.github' --exclude='README.md' \
            /tmp/flamenco-spanish-source/ ./
          test -f index.html
          test -f assets/logo-agency.webp
          test -f assets/originales/cuadro-flamenco.jpg
          test ! -e portal.html
          test ! -e admin.html
          test ! -e supabase
          test ! -f CNAME
          python3 validate_spanish.py
      - name: Commit validated Spanish pages and real photographs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import Spanish Agency pages, real images and historical URL inventory"
            git push origin HEAD:main
          fi
