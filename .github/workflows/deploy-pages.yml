name: Publish Spanish Agency staging website

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "**/index.html"
      - "assets/**"
      - "robots.txt"
      - "validate_spanish.py"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: spanish-agency-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Spanish site, media and private-portal isolation
        run: python3 validate_spanish.py
      - name: Build public pages without exposing repository metadata
        run: |
          mkdir -p _site
          cp -R assets _site/assets
          cp index.html suite-flamenca.html son-del-alma.html guitarrista-flamenco.html eventos-exclusivos.html .nojekyll robots.txt _site/
          for d in Sondelalma bodas cuadro-de-baile-suite-flamenca inicio68151b70 nachomarroco nueva-página packs-para-la-música-de-tu-boda; do
            cp -R "$d" "_site/$d"
          done
          test ! -f _site/CNAME
          test ! -e _site/portal.html
          test ! -e _site/admin.html
          grep -q 'noindex,nofollow' _site/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload public site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish Spanish staging
        id: deployment
        uses: actions/deploy-pages@v4
